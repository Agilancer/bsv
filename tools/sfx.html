<!doctype html>
<meta charset="utf-8">
<title>Weapon sounds</title>
<style>body{background:#070b18;color:#bcd;font:14px system-ui;padding:16px}button{margin:3px;padding:6px 10px;background:#123;color:#9df;border:1px solid #2a5a8a;border-radius:4px;cursor:pointer}</style>
<p>Weapon sound review: click to play (live), or <code>render(kind, pitch, dur)</code> offline from the console / tools.</p>
<div id="b"></div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.webgpu.js", "three/webgpu": "../vendor/three/three.webgpu.js", "three/tsl": "../vendor/three/three.tsl.js" } }</script>
<script type="module">
import { Audio } from '../src/engine/Audio.js';
const SOUNDS = [['phaser', 1, 0.45], ['phaser', 1, 0.9], ['tosPhaser', 1.2, 0.45], ['lance', 1, 0.5], ['spinal', 1, 0.8], ['pulsePhaser', 1], ['disruptor', 1, 0.35], ['arc', 1, 0.25], ['graviton', 1, 0.45],
  ['photon', 1], ['photon', 1.3], ['photon', 0.8], ['quantal', 1], ['quantal', 0.72], ['plasmic', 1], ['heavyTorp', 1], ['rail', 1], ['plasmaShot', 1], ['ionShot', 1], ['cannon'], ['heavy'], ['missile'], ['torpedo'], ['explosion', 1], ['explosion', 1.3],
  ['recall'], ['tractor', 1.15, 2], ['tractor', 0.85, 3], ['dockClamp', 1], ['dockClamp', 0.6], ['deckSecure']];
const live = new Audio();
for (const [k, p, d] of SOUNDS) {
  const b = document.createElement('button'); b.textContent = `${k}${p ? ' ×' + p : ''}${d ? ' ' + d + 's' : ''}`;
  b.onclick = () => { live.init(); live.ctx.resume(); live.play(k, null, 1, p, d); };
  document.getElementById('b').append(b);
}
// offline render: returns { peak, rms, dur, wav (base64), spec (frequency peaks per 20 ms) }
window.render = async (kind, pitch, dur, secs = 1.6) => {
  const sr = 44100, ctx = new OfflineAudioContext(1, sr * secs, sr);
  const a = new Audio(); a.init(ctx);
  a[kind](0.02, 1, pitch, dur);   // (play() waits for a running context; an offline one starts suspended)
  const buf = await ctx.startRendering(), d = buf.getChannelData(0);
  let peak = 0, sum = 0, last = 0;
  for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += d[i] * d[i]; if (v > 0.003) last = i; }
  // dominant frequency per 20 ms (zero crossings), to read a sweep's shape
  const spec = [];
  for (let i = 0; i + 882 < d.length && i < last; i += 882) { let z = 0, e = 0; for (let j = i + 1; j < i + 882; j++) { if ((d[j - 1] < 0) !== (d[j] < 0)) z++; e += d[j] * d[j]; } spec.push([Math.round(z / 2 / 0.02), +(Math.sqrt(e / 882)).toFixed(3)]); }
  // 16-bit WAV
  const n = Math.min(d.length, last + sr * 0.05), ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
  let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / Math.max(1, last)).toFixed(4), dur: +(last / sr).toFixed(2), spec, wav: btoa(bin) };
};
window.SOUNDS = SOUNDS;
</script>
