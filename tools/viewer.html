<!doctype html>
<html><head><meta charset="utf-8"><title>Chassis viewer</title>
<base href="../">
<style>html,body{margin:0;background:#000;overflow:hidden;color:#9cf;font:12px monospace}#info{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.webgpu.js","three/webgpu":"./vendor/three/three.webgpu.js","three/tsl":"./vendor/three/three.tsl.js","three/addons/":"./vendor/three/addons/"}}</script>
</head><body><div id="info"></div>
<script type="module">
// Lays out chassis hulls for visual checks (parameters below).
import * as THREE from 'three/webgpu';
import { Engine } from './src/engine/Engine.js';
import { preload } from './src/engine/Assets.js';
import { initMaterials } from './src/fx/materials.js';
import { SpaceBackdrop } from './src/fx/Space.js';
import { CHASSIS } from './src/game/data/chassis.js';
import { hullFor } from './src/game/ship/HullBuilder.js';
import { SpaceLights } from './src/fx/lighting.js';
import { ENEMIES } from './src/game/data/enemies.js';
import { enemyChassis } from './src/game/enemyFactory.js';
const e = await new Engine(document.body).init();
initMaterials(e);
await preload(['hull_naval','hull_graphite','hull_gold','hull_glacier','hull_dropship','hull_apc','hull_mech','hull_alien','glow_alien']);
const sky = e.add(new SpaceBackdrop(e));
new SpaceLights(e.scene);
const q = new URLSearchParams(location.search);
// ?yard=velscour[,corsair]  ?id=velscour_5  ?tmin=6&tmax=10  ?d=distance ?cx= ?cz= focus ?yaw= ?pitch=
// ?enemy=<size> (all factions in rows) or ?enemy=<size>&faction=<f>[,<f>]&role=<r>[,<r>]
// ?also=<yard>[,<yard>]  adds player-yard rows (same tier filter) under the enemy rows, for side-by-side checks
// ?cols=N wraps each row after N hulls;  ?heading=rad turns every hull (default: bow toward +x)
const list1 = (k) => (q.get(k) ? q.get(k).split(',') : null);
const yards = list1('yard'), only = q.get('id'), tmax = +(q.get('tmax') || 10), tmin = +(q.get('tmin') || 1);
const esize = q.get('enemy'), efacs = list1('faction'), eroles = list1('role'), also = list1('also');
const enemyRows = esize ? ENEMIES.filter(e => e.size === esize && (!efacs || efacs.includes(e.faction)) && (!eroles || eroles.includes(e.role)))
  .map(e => ({ ...enemyChassis(e), row: e.faction })) : [];
const yardRows = (!esize || also) ? CHASSIS.filter(c => (!(also || yards) || (also || yards).includes(c.yard)) && (!only || c.id === only) && c.tier <= tmax && c.tier >= tmin) : [];
const list = [...enemyRows, ...yardRows];
const rowKey = (c) => c.row || c.yard;
const rows = [...new Set(list.map(rowKey))];
const cols = +(q.get('cols') || 99);
const heading = q.has('heading') ? +q.get('heading') : Math.PI / 2;
let zz = 0, maxX = 0;
rows.forEach((yk) => {
  const inRow = list.filter(c => rowKey(c) === yk);
  for (let r0 = 0; r0 < inRow.length; r0 += cols) {
    const chunk = inRow.slice(r0, r0 + cols);
    const gap = Math.max(...chunk.map(c => c.len)) * 0.45 + 40;
    let xx = 0;
    chunk.forEach((c) => {
      const h = hullFor(c);
      h.group.rotation.y = heading;
      h.group.position.set(xx + c.len / 2, 0, zz);
      xx += c.len * 1.15 + 20;
      e.scene.add(h.group);
    });
    maxX = Math.max(maxX, xx);
    zz += gap;
  }
});
// ?fit centres the camera on the layout and backs off until it all fits
const fit = q.has('fit');
const cx = +(q.get('cx') || (fit ? maxX / 2 : 600)), cz = +(q.get('cz') || (fit ? (zz - 40) / 2 : 260)), yaw = +(q.get('yaw') || (fit ? 0 : 0.8));
const cam = e.camera, d = +(q.get('d') || (fit ? Math.max(maxX * 1.85 / cam.aspect, zz * 1.6, 200) : 1100));
const pitch = q.has('pitch') ? +q.get('pitch') : Math.atan2(0.75, 0.6);
cam.position.set(cx + d * Math.cos(pitch) * Math.sin(yaw), d * Math.sin(pitch), cz + d * Math.cos(pitch) * Math.cos(yaw)); cam.lookAt(cx, 0, cz);
sky.follow = new THREE.Vector3(cx, 0, cz);
const info = document.getElementById('info');
e.add({ update() { info.textContent = `${e.backend} ${e.fps.toFixed(0)} fps  ${list.length} hulls`; } });
e.start();
window.__ready = true;
</script></body></html>
