<!doctype html>
<html><head><meta charset="utf-8"><title>Chassis viewer</title>
<base href="../">
<style>html,body{margin:0;background:#000;overflow:hidden;color:#9cf;font:12px monospace}#info{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.webgpu.js","three/webgpu":"./vendor/three/three.webgpu.js","three/tsl":"./vendor/three/three.tsl.js","three/addons/":"./vendor/three/addons/"}}</script>
</head><body><div id="info"></div>
<script type="module">
// Lays out chassis hulls for visual checks (parameters below).
import * as THREE from 'three/webgpu';
import { Engine } from './src/engine/Engine.js';
import { preload } from './src/engine/Assets.js';
import { initMaterials } from './src/fx/materials.js';
import { SpaceBackdrop } from './src/fx/Space.js';
import { CHASSIS } from './src/game/data/chassis.js';
import { hullFor, buildHull, setHullKits } from './src/game/ship/HullBuilder.js';
import { loadKits } from './src/game/ship/kitAssembler.js';
import { buildWeapon } from './src/game/ship/WeaponModels.js';
import { BASES } from './src/game/data/items.js';
import { SpaceLights } from './src/fx/lighting.js';
import { ENEMIES } from './src/game/data/enemies.js';
import { enemyChassis } from './src/game/enemyFactory.js';
const e = await new Engine(document.body).init();
initMaterials(e);
await preload(['hull_naval','hull_graphite','hull_gold','hull_glacier','hull_dropship','hull_apc','hull_mech','hull_alien','glow_alien']);
const sky = e.add(new SpaceBackdrop(e));
new SpaceLights(e.scene);
const q = new URLSearchParams(location.search);
// ?yard=velscour[,corsair]  ?id=velscour_5  ?tmin=6&tmax=10  ?d=distance ?cx= ?cz= focus ?yaw= ?pitch=
// ?enemy=<size> (all factions in rows) or ?enemy=<size>&faction=<f>[,<f>]&role=<r>[,<r>]
// ?also=<yard>[,<yard>]  adds player-yard rows (same tier filter) under the enemy rows, for side-by-side checks
// ?cols=N wraps each row after N hulls;  ?heading=rad turns every hull (default: bow toward +x)
// Part-kit hulls (docs/ships/kit-spec.md):  ?nokit forces the procedural builder;  ?vs puts the procedural hull
// beside each kit hull;  ?hp draws a box at every hardpoint and engine;  ?guns mounts a weapon model on each mount
if (q.has('nokit')) setHullKits(false); else await loadKits();
const GUN = { broadside: 'macrocannon', turret: Object.keys(BASES).find((k) => BASES[k].slot === 'turret'), prow: Object.keys(BASES).find((k) => BASES[k].slot === 'prow') };
if (!BASES[GUN.broadside] || BASES[GUN.broadside].slot !== 'broadside') GUN.broadside = Object.keys(BASES).find((k) => BASES[k].slot === 'broadside');
const HPC = { broadside: 0xff4040, turret: 0x40ff60, prow: 0x40a0ff, hangar: 0xffe040 };
function dress(h) {
  if (q.has('hp')) {
    const box = (pos, r, hex) => { const m = new THREE.Mesh(new THREE.BoxGeometry(r, r, r), new THREE.MeshBasicMaterial({ color: hex })); m.position.copy(pos); h.group.add(m); };
    for (const p of h.hardpoints) box(p.pos, h.dims.W * 0.16, HPC[p.type]);
    for (const en of h.engines) box(en.pos, en.r * 0.5, 0xffffff);
  }
  if (q.has('guns')) for (const p of h.hardpoints) {
    if (p.type === 'hangar' || !GUN[p.type]) continue;
    const m = buildWeapon({ base: GUN[p.type], rarity: 'common' }, p, h.dims.W * 0.72 * (p.type === 'prow' ? 1.2 : 1));
    m.object.position.copy(p.pos);
    if (p.type === 'broadside' && p.dir.x < 0) m.object.rotation.y = Math.PI;
    if (p.side === 'ventral') m.object.rotation.z = Math.PI;
    h.group.add(m.object);
  }
  return h;
}
const list1 = (k) => (q.get(k) ? q.get(k).split(',') : null);
const yards = list1('yard'), only = q.get('id'), tmax = +(q.get('tmax') || 10), tmin = +(q.get('tmin') || 1);
const esize = q.get('enemy'), efacs = list1('faction'), eroles = list1('role'), also = list1('also');
const enemyRows = esize ? ENEMIES.filter(e => e.size === esize && (!efacs || efacs.includes(e.faction)) && (!eroles || eroles.includes(e.role)))
  .map(e => ({ ...enemyChassis(e), row: e.faction })) : [];
const yardRows = (!esize || also) ? CHASSIS.filter(c => (!(also || yards) || (also || yards).includes(c.yard)) && (!only || c.id === only) && c.tier <= tmax && c.tier >= tmin) : [];
const list = [...enemyRows, ...yardRows];
const rowKey = (c) => c.row || c.yard;
const rows = [...new Set(list.map(rowKey))];
const cols = +(q.get('cols') || 99);
const heading = q.has('heading') ? +q.get('heading') : Math.PI / 2;
let zz = 0, maxX = 0;
rows.forEach((yk) => {
  const inRow = list.filter(c => rowKey(c) === yk);
  for (let r0 = 0; r0 < inRow.length; r0 += cols) {
    const chunk = inRow.slice(r0, r0 + cols);
    const gap = Math.max(...chunk.map(c => c.len)) * 0.45 + 40;
    let xx = 0;
    chunk.forEach((c) => {
      for (const h of q.has('vs') ? [hullFor(c), buildHull(c, { kit: false })] : [hullFor(c)]) {
        dress(h);
        h.group.rotation.y = heading;
        h.group.position.set(xx + c.len / 2, 0, zz);
        xx += c.len * 1.15 + 20;
        e.scene.add(h.group);
      }
    });
    maxX = Math.max(maxX, xx);
    zz += gap;
  }
});
// ?fit centres the camera on the layout and backs off until it all fits
const fit = q.has('fit');
const cx = +(q.get('cx') || (fit ? maxX / 2 : 600)), cz = +(q.get('cz') || (fit ? (zz - 40) / 2 : 260)), yaw = +(q.get('yaw') || (fit ? 0 : 0.8));
const cam = e.camera, d = +(q.get('d') || (fit ? Math.max(maxX * 1.85 / cam.aspect, zz * 1.6, 200) : 1100));
const pitch = q.has('pitch') ? +q.get('pitch') : Math.atan2(0.75, 0.6);
cam.position.set(cx + d * Math.cos(pitch) * Math.sin(yaw), d * Math.sin(pitch), cz + d * Math.cos(pitch) * Math.cos(yaw)); cam.lookAt(cx, 0, cz);
sky.follow = new THREE.Vector3(cx, 0, cz);
const info = document.getElementById('info');
e.add({ update() { info.textContent = `${e.backend} ${e.fps.toFixed(0)} fps  ${list.length} hulls`; } });
// For scripted review renders (tools/kitshots.cjs): move the camera, show one hull, switch to black silhouettes or to
// normals (clay).
const placed = [];
e.scene.traverse((o) => { if (o.userData && o.userData.len && o.parent === e.scene) placed.push(o); });
const BLACK = new THREE.MeshBasicMaterial({ color: 0x000000 }), NORMALS = new THREE.MeshNormalMaterial();
window.__viewer = {
  hulls: () => placed.map((g, i) => ({ i, x: g.position.x, z: g.position.z, len: g.userData.len, W: g.userData.W, top: g.userData.top })),
  cam(cx, cy, cz, d, yaw, pitch) { cam.position.set(cx + d * Math.cos(pitch) * Math.sin(yaw), cy + d * Math.sin(pitch), cz + d * Math.cos(pitch) * Math.cos(yaw)); cam.lookAt(cx, cy, cz); sky.follow.set(cx, 0, cz); },
  only(i) { placed.forEach((g, k) => { g.visible = i == null || k === i; }); },
  row(z) { placed.forEach((g) => { g.visible = g.position.z === z; }); },
  black(on) {
    for (const g of placed) g.traverse((o) => { if (!o.isMesh) return; if (on) { o.userData.lit ??= o.material; o.material = BLACK; } else if (o.userData.lit) o.material = o.userData.lit; });
    e.scene.traverse((o) => { if (o.parent === e.scene && !placed.includes(o) && !o.isLight) o.visible = !on; });
    e.scene.background = on ? new THREE.Color(0x5a6068) : null;
  },
  // normals instead of the yard's materials, on a dark ground: a hole or an inside-out face shows at once
  clay(on) {
    for (const g of placed) g.traverse((o) => { if (!o.isMesh) return; if (on) { o.userData.lit2 ??= o.material; o.material = NORMALS; } else if (o.userData.lit2) o.material = o.userData.lit2; });
    e.scene.traverse((o) => { if (o.parent === e.scene && !placed.includes(o) && !o.isLight) o.visible = !on; });
    e.scene.background = on ? new THREE.Color(0x24282c) : null;
  },
};
e.start();
window.__ready = true;
</script></body></html>
