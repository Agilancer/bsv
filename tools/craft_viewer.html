<!doctype html>
<html><head><meta charset="utf-8"><title>Craft viewer</title>
<base href="../">
<style>
html,body{margin:0;background:#000;overflow:hidden;color:#9cf;font:12px monospace}
#info{position:fixed;left:8px;top:8px;white-space:pre;opacity:.6}
.lbl{position:fixed;transform:translate(-50%,0);text-align:center;white-space:nowrap;font:600 13px system-ui,sans-serif;color:#e8f2ff;text-shadow:0 1px 3px #000,0 0 6px #000}
.lbl i{display:block;font:400 11px system-ui,sans-serif;font-style:normal;color:#9ab8d8}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.webgpu.js","three/webgpu":"./vendor/three/three.webgpu.js","three/tsl":"./vendor/three/three.tsl.js","three/addons/":"./vendor/three/addons/"}}</script>
</head><body><div id="info"></div>
<script type="module">
// Lays out the hangar craft (tools/blender/craft.py) for review, drawn exactly as the game draws them: the
// instanced meshes and the shared craft materials of src/game/combat/craftModels.js, under the space lights.
//   ?line=navy (tools/blender/craft_<line>.py)   ?kinds=fighter,bomber   ?teams=ally,hostile (rows; hostile wears ?hex=ff4a3a on dark plate)
//   ?old  the old five-box craft beside each, for before/after   ?d= ?yaw= ?pitch= camera   ?nolabels
//   window.__viewer.cam(x, y, z, dist, yaw, pitch) · .list() (each craft's x, z, length) · .only(i|null) · .spin(rad)
import * as THREE from 'three/webgpu';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Engine } from './src/engine/Engine.js';
import { preload } from './src/engine/Assets.js';
import { initMaterials } from './src/fx/materials.js';
import { SpaceBackdrop } from './src/fx/Space.js';
import { SpaceLights } from './src/fx/lighting.js';
import { CRAFT } from './src/game/data/craft.js';
import { loadCraft, craftMaterials } from './src/game/combat/craftModels.js';

const q = new URLSearchParams(location.search);
const kinds = q.get('kinds') ? q.get('kinds').split(',') : Object.keys(CRAFT);
const teams = q.get('teams') ? q.get('teams').split(',') : ['ally', 'hostile'];
const e = await new Engine(document.body).init();
initMaterials(e);
await preload(['hull_naval', 'hull_graphite']);
e.add(new SpaceBackdrop(e));
new SpaceLights(e.scene);
const line = q.get('line') || 'navy';
const models = await loadCraft(line);
const mats = craftMaterials(e);
const TEAM = { ally: [new THREE.Color(0x5aa8ff), 1], hostile: [new THREE.Color(+('0x' + (q.get('hex') || 'ff4a3a'))), 0.42] };

// the old craft: five boxes, one flat material (Hangars.js before the Blender models)
function oldCraft() {
  const parts = [];
  const b = (w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); const c = new THREE.BufferGeometry(); const n = g.toNonIndexed(); c.setAttribute('position', n.attributes.position); c.setAttribute('normal', n.attributes.normal); parts.push(c); };
  b(0.9, 0.5, 4, 0, 0, 0); b(4.4, 0.15, 1.3, 0, 0, -0.6); b(0.15, 1.1, 1.0, 1.9, 0.4, -0.8); b(0.15, 1.1, 1.0, -1.9, 0.4, -0.8); b(0.5, 0.35, 1.0, 0, 0.35, 0.8);
  const m = new THREE.MeshStandardNodeMaterial({ roughness: 0.4, metalness: 0.4, color: 0xd9d9d9, emissive: 0x141a29 });
  return new THREE.Mesh(mergeGeometries(parts), m);
}

const placed = [];
let x = 0, rowZ = 0, rowL = 0;
const gap = 5, wrap = q.has('wrap') ? +q.get('wrap') : 4;
let col = 0;
for (const k of kinds) {
  const md = models && models[k];
  if (!md) continue;
  const f = md.facts, L = f ? f.dims.L : 8, Wd = f ? f.dims.W : 6;
  if (wrap && col === wrap) { col = 0; x = 0; rowZ -= rowL + 10; rowL = 0; }
  col++; rowL = Math.max(rowL, L);
  const cx = x + Wd / 2;
  const n = teams.length;
  const team = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  md.body.setAttribute('team', team);
  const body = new THREE.InstancedMesh(md.body, mats.body, n);
  const flame = md.flame ? new THREE.InstancedMesh(md.flame, mats.flame, n) : null;
  if (md.flame) md.flame.setAttribute('team', team);
  teams.forEach((tk, i) => {
    const z = rowZ - i * 400;
    const m4 = new THREE.Matrix4().makeTranslation(cx, 0, z + (f ? -(f.dims.maxZ + f.dims.minZ) / 2 : 0));
    body.setMatrixAt(i, m4);
    if (flame) flame.setMatrixAt(i, m4);
    const [c, tone] = TEAM[tk];
    team.array.set([c.r, c.g, c.b, tone], i * 4);
    placed.push({ kind: k, team: tk, x: cx, z, L, W: Wd, H: f ? f.dims.H : 2, i, body });
  });
  e.scene.add(body); if (flame) { flame.renderOrder = 2; e.scene.add(flame); }
  if (q.has('old')) { const o = oldCraft(); o.scale.setScalar(k === 'bomber' ? 1.5 : 1.1); o.position.set(cx, 0, 18); e.scene.add(o); }
  body.userData.flame = flame;
  x += Wd + gap;
}
const total = x - gap;
const cam = e.camera;
const view = { x: total / 2, y: 0, z: -(teams.length - 1) * 10, d: +(q.get('d') || Math.max(40, total * 0.75)), yaw: +(q.get('yaw') || 0.6), pitch: +(q.get('pitch') || 0.92) };
function place() {
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  cam.position.set(view.x + Math.sin(view.yaw) * cp * view.d, view.y + sp * view.d, view.z + Math.cos(view.yaw) * cp * view.d);
  cam.lookAt(view.x, view.y, view.z);
  cam.updateMatrixWorld(true);
}
cam.fov = +(q.get('fov') || 35); cam.near = 0.5; cam.far = 20000; cam.updateProjectionMatrix();
place();
const labels = q.has('nolabels') ? [] : placed.filter((p) => p.team === teams[teams.length - 1]).map((p) => {
  const el = document.createElement('div'); el.className = 'lbl';
  const c = CRAFT[p.kind], f = models[p.kind].facts;
  el.innerHTML = `${c.name}<i>${{ S: 'small', M: 'medium', L: 'large' }[c.cls]} · ${f ? f.dims.L.toFixed(1) + ' long · ' + f.tris + ' tris' : ''}</i>`;
  document.body.append(el); return { el, p };
});
const v3 = new THREE.Vector3();
function placeLabels() {
  for (const { el, p } of labels) {
    v3.set(p.x, -p.H, p.z + p.L * 0.6).project(cam);
    el.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v3.y) / 2 * innerHeight + 8) + 'px';
    el.style.display = v3.z < 1 ? '' : 'none';
  }
}
let spin = 0;
window.__viewer = {
  cam(x, y, z, d, yaw, pitch) { Object.assign(view, { x, y, z, d, yaw, pitch }); place(); placeLabels(); },
  list() { return placed.map(({ kind, team, x, z, L, W, H }) => ({ kind, team, x, z, L, W, H })); },
  only(k) { for (const p of placed) { p.body.visible = k == null || p.kind === k; if (p.body.userData.flame) p.body.userData.flame.visible = p.body.visible; } for (const l of labels) l.el.style.display = k == null || l.p.kind === k ? '' : 'none'; },
  labels(on) { for (const l of labels) l.el.style.display = on ? '' : 'none'; },
  spin(r) { spin = r; },
};
const info = document.getElementById('info');
e.add({ update(dt) { if (spin) { view.yaw += spin * dt; place(); placeLabels(); } info.textContent = `${e.backend} ${e.fps.toFixed(0)} fps`; } });
placeLabels();
e.start();
window.__ready = true;
</script></body></html>
